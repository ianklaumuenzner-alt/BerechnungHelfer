<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Volumen Kegel</title>
    <link rel="stylesheet" href="../../Styles_Interface.css">
</head>
<body>

    <div class="karte">
        <h2>Volumen Kegel</h2>
        <img class="hilfe-bild" src="SVG/kegel.svg" alt="Skizze Kegel">

        <label>Ausgabe-Einheit:</label>
        <select id="kegelEinheit" onchange="berechneKegelVolumen(); berechneKegelHoehe(); berechneKegelRadius();">
            <option value="mm">Millimeter</option>
            <option value="cm">Zentimeter</option>
            <option value="m" selected>Meter</option>
            <option value="km">Kilometer</option>
        </select>

        <div class="bereich">
            <h3>Volumen gesucht</h3>
            <div class="formel"><span>Formel:</span> V = (π · r² · h) / 3</div>

            <label>Radius r:</label>
            <div class="eingabe-zeile">
                <input id="kegelRadiusV" type="number" value="1" oninput="berechneKegelVolumen()">
                <select id="kegelRadiusVEinheit" onchange="berechneKegelVolumen()">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m" selected>m</option>
                    <option value="km">km</option>
                </select>
            </div>

            <label>Höhe h:</label>
            <div class="eingabe-zeile">
                <input id="kegelHoeheV" type="number" value="3" oninput="berechneKegelVolumen()">
                <select id="kegelHoeheVEinheit" onchange="berechneKegelVolumen()">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m" selected>m</option>
                    <option value="km">km</option>
                </select>
            </div>

            <div id="resultatKegelVolumen" class="resultat"></div>
        </div>

        <div class="bereich">
            <h3>Höhe gesucht</h3>
            <div class="formel"><span>Formel:</span> h = (3 · V) / (π · r²)</div>

            <label>Volumen V:</label>
            <div class="eingabe-zeile">
                <input id="kegelVolumenH" type="number" value="3.142" oninput="berechneKegelHoehe()">
                <select id="kegelVolumenHEinheit" onchange="berechneKegelHoehe()">
                    <option value="mm">mm³</option>
                    <option value="cm">cm³</option>
                    <option value="m" selected>m³</option>
                    <option value="km">km³</option>
                </select>
            </div>

            <label>Radius r:</label>
            <div class="eingabe-zeile">
                <input id="kegelRadiusH" type="number" value="1" oninput="berechneKegelHoehe()">
                <select id="kegelRadiusHEinheit" onchange="berechneKegelHoehe()">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m" selected>m</option>
                    <option value="km">km</option>
                </select>
            </div>

            <div id="resultatKegelHoehe" class="resultat"></div>
        </div>

        <div class="bereich">
            <h3>Radius gesucht</h3>
            <div class="formel"><span>Formel:</span> r = √((3 · V) / (π · h))</div>

            <label>Volumen V:</label>
            <div class="eingabe-zeile">
                <input id="kegelVolumenR" type="number" value="3.142" oninput="berechneKegelRadius()">
                <select id="kegelVolumenREinheit" onchange="berechneKegelRadius()">
                    <option value="mm">mm³</option>
                    <option value="cm">cm³</option>
                    <option value="m" selected>m³</option>
                    <option value="km">km³</option>
                </select>
            </div>

            <label>Höhe h:</label>
            <div class="eingabe-zeile">
                <input id="kegelHoeheR" type="number" value="3" oninput="berechneKegelRadius()">
                <select id="kegelHoeheREinheit" onchange="berechneKegelRadius()">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m" selected>m</option>
                    <option value="km">km</option>
                </select>
            </div>

            <div id="resultatKegelRadius" class="resultat"></div>
        </div>
    </div>

    <script src="../../Interface.js"></script>
</body>
</html>
