<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Volumen Kugel</title>
    <link rel="stylesheet" href="../../Styles_Interface.css">
</head>
<body>

    <div class="karte">
        <h2>Volumen Kugel</h2>
        <img class="hilfe-bild" src="SVG/kugel.svg" alt="Skizze Kugel">

        <label>Ausgabe-Einheit:</label>
        <select id="kugelEinheit" onchange="berechneKugelVolumen(); berechneKugelRadius(); berechneKugelDurchmesser();">
            <option value="mm">Millimeter</option>
            <option value="cm">Zentimeter</option>
            <option value="m" selected>Meter</option>
            <option value="km">Kilometer</option>
        </select>

        <div class="bereich">
            <h3>Volumen gesucht</h3>
            <div class="formel"><span>Formel:</span> V = 4/3 · π · r³</div>

            <label>Radius r:</label>
            <div class="eingabe-zeile">
                <input id="kugelRadiusV" type="number" value="1" oninput="berechneKugelVolumen()">
                <select id="kugelRadiusVEinheit" onchange="berechneKugelVolumen()">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m" selected>m</option>
                    <option value="km">km</option>
                </select>
            </div>

            <div id="resultatKugelVolumen" class="resultat"></div>
        </div>

        <div class="bereich">
            <h3>Radius gesucht</h3>
            <div class="formel"><span>Formel:</span> r = ³√((3 · V) / (4 · π))</div>

            <label>Volumen V:</label>
            <div class="eingabe-zeile">
                <input id="kugelVolumenR" type="number" value="4.189" oninput="berechneKugelRadius()">
                <select id="kugelVolumenREinheit" onchange="berechneKugelRadius()">
                    <option value="mm">mm³</option>
                    <option value="cm">cm³</option>
                    <option value="m" selected>m³</option>
                    <option value="km">km³</option>
                </select>
            </div>

            <div id="resultatKugelRadius" class="resultat"></div>
        </div>

        <div class="bereich">
            <h3>Durchmesser gesucht</h3>
            <div class="formel"><span>Formel:</span> d = 2 · ³√((3 · V) / (4 · π))</div>

            <label>Volumen V:</label>
            <div class="eingabe-zeile">
                <input id="kugelVolumenD" type="number" value="4.189" oninput="berechneKugelDurchmesser()">
                <select id="kugelVolumenDEinheit" onchange="berechneKugelDurchmesser()">
                    <option value="mm">mm³</option>
                    <option value="cm">cm³</option>
                    <option value="m" selected>m³</option>
                    <option value="km">km³</option>
                </select>
            </div>

            <div id="resultatKugelDurchmesser" class="resultat"></div>
        </div>
    </div>

    <script src="../../Interface.js"></script>
</body>
</html>
