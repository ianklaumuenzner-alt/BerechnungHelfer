<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Volumen Würfel</title>
    <link rel="stylesheet" href="../../Styles_Interface.css">
</head>
<body>

    <div class="karte">
        <h2>Volumen Würfel</h2>
        <img class="hilfe-bild" src="SVG/wuerfel.svg" alt="Skizze Würfel">

        <label>Ausgabe-Einheit:</label>
        <select id="wuerfelEinheit" onchange="berechneWuerfelVolumen(); berechneWuerfelSeite();">
            <option value="mm">Millimeter</option>
            <option value="cm">Zentimeter</option>
            <option value="m" selected>Meter</option>
            <option value="km">Kilometer</option>
        </select>

        <div class="bereich">
            <h3>Volumen gesucht</h3>
            <div class="formel"><span>Formel:</span> V = a³</div>

            <label>Seitenlänge a:</label>
            <div class="eingabe-zeile">
                <input id="wuerfelSeiteV" type="number" value="2" oninput="berechneWuerfelVolumen()">
                <select id="wuerfelSeiteVEinheit" onchange="berechneWuerfelVolumen()">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m" selected>m</option>
                    <option value="km">km</option>
                </select>
            </div>

            <div id="resultatWuerfelVolumen" class="resultat"></div>
        </div>

        <div class="bereich">
            <h3>Seitenlänge gesucht</h3>
            <div class="formel"><span>Formel:</span> a = ³√V</div>

            <label>Volumen V:</label>
            <div class="eingabe-zeile">
                <input id="wuerfelVolumenA" type="number" value="8" oninput="berechneWuerfelSeite()">
                <select id="wuerfelVolumenAEinheit" onchange="berechneWuerfelSeite()">
                    <option value="mm">mm³</option>
                    <option value="cm">cm³</option>
                    <option value="m" selected>m³</option>
                    <option value="km">km³</option>
                </select>
            </div>

            <div id="resultatWuerfelSeite" class="resultat"></div>
        </div>
    </div>

    <script src="../../Interface.js"></script>
</body>
</html>
