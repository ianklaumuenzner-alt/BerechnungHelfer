<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Rechner mit Tabs</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f3e8;
      font-size: 18px;
      line-height: 1.6;
      margin: 30px;
    }

    .tab-button {
      padding: 12px 20px;
      font-size: 18px;
      margin-right: 5px;
      cursor: pointer;
    }

    .tab {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border: 2px solid #333;
      border-radius: 10px;
      background-color: #fffaf0;
      max-width: 500px;
    }

    .tab.active {
      display: block;
    }

    input {
      font-size: 18px;
      padding: 8px;
      width: 150px;
      margin-top: 5px;
    }

    .resultat {
      margin-top: 20px;
      padding: 12px;
      background-color: #eaf4ea;
      border-left: 6px solid #2f6f3e;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h1>Technische Rechner</h1>

  <button class="tab-button" onclick="zeigeTab('widerstand')">Widerstand</button>
  <button class="tab-button" onclick="zeigeTab('volumen')">Volumen</button>

  <!-- Tab 1: Widerstand -->
  <div id="widerstand" class="tab active">
    <h2>Ohmsches Gesetz</h2>

    <label>Spannung U in V:</label><br>
    <input id="U" type="number" value="24" oninput="berechneWiderstand()">

    <br><br>

    <label>Widerstand R in Ω:</label><br>
    <input id="R" type="number" value="10" oninput="berechneWiderstand()">

    <div id="resultatWiderstand" class="resultat"></div>
  </div>

  <!-- Tab 2: Volumen -->
  <div id="volumen" class="tab">
    <h2>Volumen Zylinder</h2>

    <label>Durchmesser d in mm:</label><br>
    <input id="d" type="number" value="100" oninput="berechneVolumen()">

    <br><br>

    <label>Höhe h in mm:</label><br>
    <input id="h" type="number" value="200" oninput="berechneVolumen()">

    <div id="resultatVolumen" class="resultat"></div>
  </div>

  <script>
    function zeigeTab(tabName) {
      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      document.getElementById(tabName).classList.add("active");
    }

    function berechneWiderstand() {
      let U = Number(document.getElementById("U").value);
      let R = Number(document.getElementById("R").value);

      if (R === 0) {
        document.getElementById("resultatWiderstand").innerText = "R darf nicht 0 Ω sein.";
        return;
      }

      let I = U / R;
      let P = U * I;

      document.getElementById("resultatWiderstand").innerText =
        "Strom I = " + I.toFixed(2) + " A\n" +
        "Leistung P = " + P.toFixed(2) + " W";
    }

    function berechneVolumen() {
      let d = Number(document.getElementById("d").value);
      let h = Number(document.getElementById("h").value);

      let r = d / 2;
      let volumen_mm3 = Math.PI * r * r * h;
      let volumen_liter = volumen_mm3 / 1000000;

      document.getElementById("resultatVolumen").innerText =
        "Volumen = " + volumen_mm3.toFixed(2) + " mm³\n" +
        "Volumen = " + volumen_liter.toFixed(3) + " Liter";
    }

    berechneWiderstand();
    berechneVolumen();
  </script>

</body>
</html>
